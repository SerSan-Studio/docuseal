# SerSan: immagine Docker del fork, su GitHub Container Registry (ghcr.io/sersan-studio/docuseal).
# Parte con un tag sersan-* (per esempio sersan-3.4.0-1) o a mano. Vedi SERSAN.md.
# Il workflow docker.yml di DocuSeal (Docker Hub, segreti loro) in questo fork è spento.
name: SerSan image

on:
  push:
    tags: ['sersan-*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sersan-studio/docuseal
          tags: |
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
