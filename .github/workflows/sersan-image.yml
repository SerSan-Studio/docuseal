# SerSan: immagine Docker del fork, su GitHub Container Registry (ghcr.io/sersan-studio/docuseal, PRIVATA).
# Il server non ha credenziali di GitHub: l'immagine arriva come artefatto (docker save, 7 giorni) che si scarica
# con `gh run download` e si carica con `docker load` (docs interne SerSan, docuseal.md).
# Parte con un tag sersan-* (per esempio sersan-3.4.0-1) o a mano. Vedi SERSAN.md.
# Il workflow docker.yml di DocuSeal (Docker Hub, segreti loro) in questo fork è spento.
name: SerSan image

on:
  push:
    tags: ['sersan-*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sersan-studio/docuseal
          tags: |
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Immagine come artefatto (per il server, che non ha credenziali di GitHub)
        run: |
          docker pull "ghcr.io/sersan-studio/docuseal:${GITHUB_REF_NAME}"
          docker save "ghcr.io/sersan-studio/docuseal:${GITHUB_REF_NAME}" | gzip -1 > docuseal-image.tar.gz
          sha256sum docuseal-image.tar.gz | tee docuseal-image.tar.gz.sha256
          ls -la docuseal-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: docuseal-image-${{ github.ref_name }}
          path: |
            docuseal-image.tar.gz
            docuseal-image.tar.gz.sha256
          retention-days: 7
          compression-level: 0
