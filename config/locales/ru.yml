  your_email_could_not_be_reached_this_may_happen_if_there_was_a_typo_in_your_address_or_if_your_mailbox_is_not_available_please_contact_support_email_to_log_in: Не удалось доставить письмо на ваш адрес электронной почты. Возможно, в адресе есть опечатка или почтовый ящик недоступен. Чтобы войти, напишите на support@docuseal.com.
  efficient_search_with_search_index: Быстрый поиск с поисковым индексом
  reindex: Переиндексировать
  build_search_index: Создать поисковый индекс
  require_two_factor_authentication_2fa_with_an_authenticator_app_e_g_google_authenticator_authy_all_users_signing_documents_must_pass_the_second_factor_verification_using_a_secure_code_in_addition_to_their_password: Требовать двухфакторную аутентификацию (2FA) через приложение-аутентификатор (например, Google Authenticator, Authy). Все пользователи, подписывающие документы, должны помимо пароля пройти проверку второго фактора с помощью защищённого кода.
  add_a_unique_signature_id_and_timestamp_to_each_signature_for_audit_and_traceability_purposes_along_with_the_timestamp_part_of_docuseals_21_cfr_part_11_compliance_settings: "Добавлять к каждой подписи уникальный ID подписи и метку времени для аудита и отслеживаемости. Входит в настройки соответствия требованиям 21 CFR Part 11."
  require_signer_to_provide_a_reason_for_signing_before_completing_their_signature_e_g_approvals_certifications_part_of_docuseals_21_cfr_part_11_compliance_settings: "Требовать от подписантов указывать причину подписания перед завершением подписи (например, согласование, сертификация). Входит в настройки соответствия требованиям 21 CFR Part 11."
  allow_signers_to_create_signatures_by_typing_their_name_instead_of_drawing_or_uploading_one: Разрешить подписантам создавать подпись, вводя своё имя, а не рисуя или загружая её.
  allow_signers_to_resubmit_forms_after_completion_useful_when_corrections_or_multiple_submissions_are_needed: Разрешить подписантам повторно отправлять формы после завершения — это удобно, если нужны исправления или несколько отправок.
  allow_recipients_to_decline_signing_a_document_the_decline_reason_notification_will_be_sent_to_the_signature_requester: Разрешить получателям отклонять подписание документа. Уведомление с причиной отклонения будет отправлено автору запроса на подпись.
  allow_recipients_to_delegate_documents: Разрешить получателям делегировать документы другому человеку по электронной почте. Это полезно, когда исходному получателю нужно передать документ уполномоченному подписанту.
  save_a_users_signature_and_automatically_pre_fill_it_in_future_signing_sessions: Сохранять подпись пользователя и автоматически подставлять её при следующих подписаниях.
  make_document_download_links_expire_after_40_minutes_to_prevent_long_term_access_and_enhance_security: Ограничить срок действия ссылок на скачивание документов 40 минутами, чтобы исключить долгосрочный доступ и повысить безопасность.
  require_authentication_with_user_login_or_api_key_to_access_the_document_download_links: Требовать аутентификацию через вход пользователя или ключ API для доступа к ссылкам на скачивание документов.
  combine_signed_documents_and_the_audit_log_into_a_single_pdf_file_for_easier_recordkeeping_and_compliance: Объединять подписанные документы и журнал аудита в один PDF-файл для удобства учёта и соблюдения требований.
  require_a_jwt_authorization_to_preview_embedded_forms_ensuring_only_authorized_users_can_view_them: Требовать авторизацию JWT для предпросмотра встроенных форм, чтобы их могли просматривать только авторизованные пользователи.
  make_all_newly_created_templates_private_to_their_creator_by_default: По умолчанию делать все новые шаблоны доступными только их автору.
  make_the_recipients_signing_order_always_enforced_so_that_the_second_signer_can_start_signing_their_part_only_after_the_first_signer_has_completed_signing: 'Всегда соблюдать порядок подписания: второй подписант сможет подписать свою часть только после того, как первый завершит подписание.'
  the_file_is_missing_make_sure_you_have_access_to_it_on_google_drive: Файл не найден. Убедитесь, что у вас есть к нему доступ в Google Drive.
